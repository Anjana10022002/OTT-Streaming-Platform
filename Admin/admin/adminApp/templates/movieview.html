<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ movie.title }} - Movie View</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>
    <div class="movie-page">
        <div class="banner-container">
            <img src="{{ movie.banner.url }}" alt="{{ movie.title }}" class="banner-image">
            <div class="banner-title">
                <h1>{{ movie.title }}</h1>
            </div>
        </div>

        <div class="movie-main">
            <div class="poster-box">
                <img src="{{ movie.thumbnail.url }}" alt="{{ movie.title }}" class="poster-image">
            </div>
            
            <div class="details-box">
                <div class="desc-box">
                    <h3>Description</h3>
                    <p>{{ movie.description }}</p>
                </div>
                
                <div class="video-box">
                    <h3>Watch Video</h3>
                    <video controls>
                        <source src="{{ movie.video_file.url }}" type="video/mp4">
                    </video>
                </div>
                
                <a href="{% url 'movielist' %}" class="back-link">← Back to Movies</a>
            </div>
        </div>
    </div>
</body>
</html>
