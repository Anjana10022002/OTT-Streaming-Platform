<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User List</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
<div class="admin-layout">

    {% include 'partials/navbar.html' %}

    <main class="main-content">
        <h1>User List</h1>

        <!-- Search -->
        <form method="GET" class="search-box">
            <input type="text" name="q" placeholder="Search by email"
                   value="{{ query }}">
            <button type="submit">Search</button>
        </form>

        <!-- Table -->
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>User Email</th>
                        <th>History</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody>
                {% for user in users %}
                    <tr>
                        <td>{{ user.email }}</td>

                        <!-- View History -->
                        <td>
                            <a href="{% url 'user_history' user.id %}"
                               class="action-btn">
                                View History
                            </a>
                        </td>

                        <!-- Block / Unblock -->
                        <td>
                            <a href="{% url 'toggle_user' user.id %}"
                               class="action-btn {% if not user.is_active %}danger-btn{% endif %}">
                                {% if user.is_active %}Block{% else %}Unblock{% endif %}
                            </a>
                        </td>
                    </tr>
                {% empty %}
                    <tr>
                        <td colspan="3">No users found</td>
                    </tr>
                {% endfor %}
                </tbody>
            </table>
        </div>

    </main>
</div>
</body>
</html>
