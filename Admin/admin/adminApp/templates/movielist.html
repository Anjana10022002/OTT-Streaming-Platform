<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie List</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>

<body>
<div class="admin-layout">

    {% include 'partials/navbar.html' %}

    <main class="main-content">
        <h1>Movie List</h1>

        <a href="{% url 'addmovie' %}" class="primary-btn">Add Movie</a>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Thumbnail</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for movie in movies %}
                    <tr>
                        <td>
                            <img src="{{ movie.thumbnail.url }}" alt="{{ movie.title }}" width="80">
                        </td>
                        <td>{{ movie.title }}</td>
                        <td>{{ movie.description|truncatechars:60 }}</td>
                        <td>
                            <a href="{% url 'movieview' %}?id={{ movie.id }}" class="action-btn">View</a>
                            <a href="{% url 'addmovie' %}?edit={{ movie.id }}" class="action-btn">Edit</a>

                            <form method="POST" action="{% url 'delete_movie' movie.id %}" style="display:inline;">
                                {% csrf_token %}
                                <button type="submit" class="danger-btn"
                                    onclick="return confirm('Delete this movie?')">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="4">No movies found</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>

</div>
</body>
</html>
